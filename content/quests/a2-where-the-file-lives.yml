# Area 2b, and the first `local-repo` quest in the campaign. Spec §6.3: the API pulls his
# repository and runs the quest's pytest specification. §6.4: it can only do that because he
# pushed, which is why this verifier does not arrive until after `git-push` is taught.
#
# No starter. `scaffold.ts` writes one only for `hidden-tests`, and §6.3 confines that to
# Areas 0-1 -- from here on the starting point is a file in his own repository, which is the
# whole of §3 principle 8.
id: a2-where-the-file-lives
title: "Where The File Lives"
kind: quest
area: 2
concepts: [files-on-disk, running-scripts]
dc: 10                # XP and the risk label both derive from this (§5.1)
brief: briefs/a2-where-the-file-lives.md

verifier:
  type: local-repo
  tests: tests/a2-where-the-file-lives_test.py
