# web — the Vite dev server (§6.1). Owned by the `spa` track.
#
# Development only. In production the api serves the built SPA, which is why §6.1 gives
# this service a host port and no deployment story.
#
# Profile-gated: `docker compose up` must keep meaning "postgres and gitea" until someone
# asks for more. Start it with `docker compose --profile web up web`.
#
# No build context on purpose. A Dockerfile that does not exist yet is a trap for whoever
# first runs the wrong command, and a dev server wants the workspace mounted anyway — an
# image rebuild per edit is the opposite of what Vite is for.

services:

  web:
    profiles: ["web"]
    # Built, and it serves a BUILD rather than a dev server — ruled 2026-09-01. The container is
    # what the learner's laptop reaches over the LAN (§6.4); development stays on the host with
    # `npm run dev`.
    #
    # `VITE_API_URL` is a BUILD arg, not an environment variable, because Vite substitutes it into
    # the bundle at build time. Setting it under `environment:` would do nothing, silently. See
    # `apps/web/Dockerfile`.
    build:
      context: ../../pyquest
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: "http://localhost:${API_PORT:-3081}"
    image: pyquest-web:local
    container_name: pyquest-web
    # Nothing here says how to serve. `apps/web/Dockerfile` ends in `serve --single`, and the
    # `--single` is load-bearing: `/area/3/quest/a3-recipe-book` is a real URL the learner can
    # reload or bookmark, and a static server without a history fallback answers 404 to every
    # client-side route.
    #
    # The command, working_dir and VITE_API_URL environment entry that stood here are gone with
    # the dev server. The last of those is the one to be careful about: it is a BUILD arg now,
    # because Vite inlines it into the bundle. Left under `environment:` it would have been read
    # by nothing and changed nothing, which is the quietest way to be wrong.
    # No `depends_on: api`, and the reason is a compose rule rather than a design choice.
    #
    # `api` lives in the `api` profile and this lives in `web`, and compose refuses a dependency
    # on a service whose profile is not also active — `service "web" depends on undefined service
    # "api"`. Declaring it here would make `--profile web` alone an invalid project.
    #
    # The relationship is real all the same: the SPA fetches from the api and reports failed
    # resources without it. That makes it a *startup ordering* concern, which is
    # `infra/start-full.cmd`'s job — it brings up both, in order, and waits for health.
    ports:
      # 3082, reserved for this service before it existed.
      - "${WEB_PORT:-3082}:3082"
