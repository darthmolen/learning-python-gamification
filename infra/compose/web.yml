# web — the Vite dev server (§6.1). Owned by the `spa` track.
#
# Development only. In production the api serves the built SPA, which is why §6.1 gives
# this service a host port and no deployment story.
#
# Profile-gated: `docker compose up` must keep meaning "postgres and gitea" until someone
# asks for more. Start it with `docker compose --profile web up web`.
#
# No build context on purpose. A Dockerfile that does not exist yet is a trap for whoever
# first runs the wrong command, and a dev server wants the workspace mounted anyway — an
# image rebuild per edit is the opposite of what Vite is for.

services:

  web:
    profiles: ["web"]
    # Built, and it serves a BUILD rather than a dev server — ruled 2026-09-01. The container is
    # what the learner's laptop reaches over the LAN (§6.4); development stays on the host with
    # `npm run dev`.
    #
    # No build args, and their absence is the design. This used to pass
    # `VITE_API_URL: http://localhost:${API_PORT:-3081}`, which Vite inlined into the bundle — so
    # the SPA served to the learner's laptop told HIS browser to call HIS localhost (§6.4 puts the
    # api on one machine and his code on another). The image now serves the api on its own origin
    # through `apps/web/Caddyfile`, so there is no address to pass and nothing to keep in sync.
    build:
      context: ../../pyquest
      dockerfile: apps/web/Dockerfile
    image: pyquest-web:local
    container_name: pyquest-web
    # Comes back when the daemon does -- see `compose/api.yml`. This is the one the learner opens, so
    # a web container that stays down after a reboot is the whole stack being absent as far as he can
    # tell, however healthy everything behind it is.
    restart: unless-stopped
    # Nothing here says how to serve. `apps/web/Caddyfile` does: it serves /srv, proxies `/api/*` to
    # `api:3081`, and falls back to index.html so `/area/3/quest/a3-recipe-book` survives a reload.
    #
    # No `depends_on: api`, and the reason is a compose rule rather than a design choice.
    #
    # `api` lives in the `api` profile and this lives in `web`, and compose refuses a dependency
    # on a service whose profile is not also active — `service "web" depends on undefined service
    # "api"`. Declaring it here would make `--profile web` alone an invalid project.
    #
    # The relationship is stronger than it was — this container now PROXIES to the api rather than
    # merely serving a client that calls it — but the shape is unchanged: both sit on the project
    # network, so the DNS name `api` resolves whenever both run, and startup ordering is
    # `infra/start-full.cmd`'s job. With the api down, `/api/*` answers 502 and the SPA reports
    # failed resources, which is the same outage it always had and a great deal easier to read than
    # the CORS error it used to produce.
    ports:
      # 3082, reserved for this service before it existed.
      - "${WEB_PORT:-3082}:3082"
