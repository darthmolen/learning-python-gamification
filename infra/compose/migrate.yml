# migrate — migrations as a job (§6.1). Owned by the `db` track.
#
# Forward-only plain SQL, applied against the shared Postgres. This is one household's
# data, not a fleet, so there is no down-migration story and that is deliberate.
#
# A job, not a service: it runs to completion and exits. `restart: "no"` says so out loud,
# because a migration job that restarts on failure re-applies migrations in a loop.
#
#   docker compose --profile migrate run --rm migrate
#
# Safe to run twice, and that is asserted rather than assumed: `packages/db` keeps a
# `schema_migrations` ledger, takes an advisory lock, and applies each file in its own
# transaction. The second run prints "already up to date", which `infra/smoke.sh` checks.
#
# `npm run migrate` builds before it runs, because the workspace is bind-mounted as source and
# nothing else in the stack compiles it. That is why the image is plain node rather than a
# built artifact: there is no api image yet, and inventing one here would be this fragment
# deciding something the api track owns.

services:

  migrate:
    profiles: ["migrate"]
    # Built rather than pulled, and the workspace is NOT mounted. Both halves matter.
    #
    # This service used to run a stock node image with `../../pyquest:/workspace` mounted, and it
    # did not start on a Windows host: `npm install` there writes `node_modules/@pyquest/*` as
    # symlinks to absolute Docker-VM paths, so `import '@pyquest/contract'` failed before the
    # migrator ran. Building fixes that — and mounting the workspace would put it straight back,
    # because a bind mount over `/workspace` masks whatever the image built underneath.
    #
    # The context is `pyquest/` rather than this package, because `npm ci` resolves the whole
    # workspace from the root lockfile.
    build:
      context: ../../pyquest
      dockerfile: packages/db/Dockerfile
    image: pyquest-migrate:local
    container_name: pyquest-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
