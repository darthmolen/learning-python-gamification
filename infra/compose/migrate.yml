# migrate — migrations as a job (§6.1). Owned by the `db` track.
#
# Forward-only plain SQL, applied against the shared Postgres. This is one household's
# data, not a fleet, so there is no down-migration story and that is deliberate.
#
# A job, not a service: it runs to completion and exits. `restart: "no"` says so out loud,
# because a migration job that restarts on failure re-applies migrations in a loop.
#
#   docker compose --profile migrate run --rm --build migrate
#
# ## `--build` is not optional, and leaving it off has already cost a day
#
# `docker compose run` uses the image if one exists. It does **not** rebuild, and the migrations
# are baked into the image rather than mounted — so a `pyquest-migrate:local` built before a
# migration was written runs the migrator it was built with, finds every file it knows about
# already applied, and prints **"migrate: already up to date"**. Which is true, and useless: it is
# a statement about the image, not about `packages/db/migrations/`.
#
# Measured 2026-09-10. The image was 8 days old and held six migrations;
# `0007-practice-progress.sql` had landed five days earlier. The job reported up to date, the
# production database stayed at six, and the running api — whose own image *did* carry 0007 and
# whose `store.ts` SELECTs, INSERTs and DELETEs against `practice_progress` — was live against a
# database with no such table. Nothing had touched the route yet, so the first practice tick would
# have been the discovery.
#
# The rebuild is cached and costs about a second when nothing changed. This is the cheapest
# possible guard against the failure mode this whole file is supposed to prevent.
#
# Safe to run twice, and that is asserted rather than assumed: `packages/db` keeps a
# `schema_migrations` ledger, takes an advisory lock, and applies each file in its own
# transaction. The second run prints "already up to date", which `infra/smoke.sh` checks —
# **and note that this particular assertion is the one a stale image can satisfy for the wrong
# reason.** What actually catches drift is smoke.sh's next check, which counts the `.sql` files on
# disk against the `schema_migrations` ledger. Keep both: one proves the ledger works, the other
# proves the image is current.
#
# `npm run migrate` builds before it runs, because the workspace is bind-mounted as source and
# nothing else in the stack compiles it. That is why the image is plain node rather than a
# built artifact: there is no api image yet, and inventing one here would be this fragment
# deciding something the api track owns.

services:

  migrate:
    profiles: ["migrate"]
    # Built rather than pulled, and the workspace is NOT mounted. Both halves matter.
    #
    # This service used to run a stock node image with `../../pyquest:/workspace` mounted, and it
    # did not start on a Windows host: `npm install` there writes `node_modules/@pyquest/*` as
    # symlinks to absolute Docker-VM paths, so `import '@pyquest/contract'` failed before the
    # migrator ran. Building fixes that — and mounting the workspace would put it straight back,
    # because a bind mount over `/workspace` masks whatever the image built underneath.
    #
    # The context is `pyquest/` rather than this package, because `npm ci` resolves the whole
    # workspace from the root lockfile.
    build:
      context: ../../pyquest
      dockerfile: packages/db/Dockerfile
    image: pyquest-migrate:local
    container_name: pyquest-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
