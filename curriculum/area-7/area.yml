# Spec §5.1a — the manifest carries the denominator every progress display needs.
# `partial` means the total below is an estimate and the UI must mark it as one: "1 of ~5".
#
# Transcribed from spec §3's Area 7 heading on 2026-08-29, not authored: the title is the
# document of record's, and `estimatedQuests` is §5.2's rule of five quests per area rather
# than a count of anything written. Nothing in this area exists yet, which is what `partial`
# says. Flip it to `complete` when curriculum/area-7/README.md's authoring status says so.
#
# Weeks come from spec §3's heading and are road markers, not a schedule (ADR 0002): they
# gate nothing, and nothing derives ahead or behind from them. The blurb is the line under
# the title on the Area screen, authored here — §3's Vehicle: lines are prose about the area
# rather than a subtitle for it.
area: 7
title: Craft
weeks: { from: 37, to: 48 }
blurb: Tests, types and the debugger. Read unfamiliar code, then open a pull request.
authoring: partial
estimatedQuests: 5
