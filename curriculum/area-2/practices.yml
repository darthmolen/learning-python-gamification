# The spine of Area 2. See area-0/practices.yml for what this file is and why it exists.
#
# One manifest covers both halves — 2a is Practices 1 to 4, 2b is 5 to 8 — the same way
# area-2/area.yml carries one week range of 6 to 8 across both.
#
# Practice 6 carries no exercise and its practice plan says so outright: "There is no quest
# tonight. Five quests plus a boss is the shape of an area (§5.2)." That is the clearest
# statement in the curriculum of the fact this whole file exists to make visible — a practice
# without a quest is still work, and the learner has to be told it counts.
area: 2
