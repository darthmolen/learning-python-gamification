# Spec §5.1a - this is the denominator every progress display reads. `partial` means the
# total below is an estimate, and the UI must render it with a tilde: "3 of ~5".
#
# It stays `partial` even though five quests and a boss are authored, because §5.2 sets
# five as the shape of an area and not as its ceiling; the estimate becomes a fact when
# somebody decides Area 1 is finished, and until then a tilde is the honest rendering.
#
# Weeks come from spec §3's heading and are road markers, not a schedule (ADR 0002): they
# gate nothing, and nothing derives ahead or behind from them. The blurb is the line under
# the title on the Area screen, authored here — §3's Vehicle: lines are prose about the area
# rather than a subtitle for it.
area: 1
title: Control
weeks: { from: 3, to: 6 }
blurb: Turtle becomes generative art. Loops repeat and conditions choose.
authoring: partial
estimatedQuests: 5
